version: 1
id: in-memory-pipeline
name: "perf: in-memory pipeline"
nodes:
  - id: start
    type: start
    label: Start
    position:
      x: 0
      y: 0
    config:
      acceptsInput: true
  - id: mapper
    type: mapper
    label: Mapper
    position:
      x: 260
      y: 0
    config:
      fields:
        - target: total
          value: $amount * 1.1
          expression: true
        - target: year
          value: $createdAt.slice(0, 4)
          expression: true
  - id: filter
    type: filter
    label: Filter
    position:
      x: 520
      y: 0
    config:
      condition: $amount > 0
  - id: router
    type: router
    label: Router
    position:
      x: 780
      y: 0
    config:
      cases:
        - label: a
          condition: $category === 'a'
  - id: typescript
    type: typescript
    label: TypeScript
    position:
      x: 1040
      y: 0
    config:
      code: |
        function process($input) {
          return { ...$input, total: Math.round($input.total) };
        }
    override: true
  - id: end
    type: end
    label: End
    position:
      x: 1300
      y: 0
    config: {}
edges:
  - source: start
    sourcePort: out-0
    target: mapper
    targetPort: in-0
  - source: mapper
    sourcePort: out-0
    target: filter
    targetPort: in-0
  - source: filter
    sourcePort: out-0
    target: router
    targetPort: in-0
  - source: router
    sourcePort: out-0
    target: typescript
    targetPort: in-0
  - source: router
    sourcePort: out-1
    target: end
    targetPort: in-0
  - source: typescript
    sourcePort: out-0
    target: end
    targetPort: in-0
