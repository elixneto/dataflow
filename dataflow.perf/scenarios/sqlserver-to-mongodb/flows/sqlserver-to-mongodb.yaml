version: 1
id: sqlserver-to-mongodb
name: "perf: SQL Server to MongoDB"
nodes:
  - id: start
    type: start
    label: Start
    position:
      x: 0
      y: 0
    config:
      parameters:
        - name: size
          type: number
          default: "50000"
  - id: query
    type: sqlserver
    label: SQL Server Query
    position:
      x: 260
      y: 0
    config:
      connection: perf-sqlserver
      sql: |-
        SELECT id, name, email, balance, since
        FROM dbo.Customer
        WHERE id <= @size
        ORDER BY id
      parameters:
        - name: size
          value: $PARAMETERS.size
          expression: true
      timeoutS: 300
  - id: mapper
    type: mapper
    label: Mapper
    position:
      x: 520
      y: 0
    config:
      fields:
        - target: fullName
          value: $name.toUpperCase()
          expression: true
        - target: balanceCents
          value: Math.round($balance * 100)
          expression: true
  - id: upsert
    type: mongodb-upsert
    label: MongoDB Upsert
    position:
      x: 780
      y: 0
    config:
      connection: perf-mongodb
      database: ""
      collection: customers
      filter:
        - field: id
          value: $id
          expression: true
      source: data
      batchSize: 500
  - id: end
    type: end
    label: End
    position:
      x: 1040
      y: 0
    config: {}
edges:
  - source: start
    sourcePort: out-0
    target: query
    targetPort: in-0
  - source: query
    sourcePort: out-0
    target: mapper
    targetPort: in-0
  - source: mapper
    sourcePort: out-0
    target: upsert
    targetPort: in-0
  - source: upsert
    sourcePort: out-0
    target: end
    targetPort: in-0
