version: 1
id: perf-child-mapper
name: "perf: child mapper"
nodes:
  - id: start
    type: start
    label: Start
    position:
      x: 0
      y: 0
    config:
      acceptsInput: true
  - id: mapper
    type: mapper
    label: Mapper
    position:
      x: 260
      y: 0
    config:
      fields:
        - target: double
          value: $amount * 2
          expression: true
  - id: end
    type: end
    label: End
    position:
      x: 520
      y: 0
    config: {}
edges:
  - source: start
    sourcePort: out-0
    target: mapper
    targetPort: in-0
  - source: mapper
    sourcePort: out-0
    target: end
    targetPort: in-0
