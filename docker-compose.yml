# Optional: a local Postgres for the server. Without it (no DATABASE_URL), the server uses PGlite in dataflow.server/data.local/.
#   docker compose up -d
#   DATABASE_URL=postgres://dataflow:dataflow@localhost:5432/dataflow   (in dataflow.server/.env, see dataflow.server/.env.example)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow
      POSTGRES_DB: dataflow
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
