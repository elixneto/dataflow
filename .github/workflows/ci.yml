name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # the storage tests also run against a real Postgres (TEST_DATABASE_URL), besides PGlite
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow
          POSTGRES_DB: dataflow
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: npm run setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://dataflow:dataflow@localhost:5432/dataflow
      - run: npm run build
